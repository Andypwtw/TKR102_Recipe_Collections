services:
  mysql:
    image: mysql:8.4
    container_name: recipe-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-recipe_ai}
      TZ: Asia/Taipei
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - recipe-net

  python:
    build:
      context: ./python
      dockerfile: Dockerfile
    image: recipe-python:dev
    container_name: recipe-python
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-recipe_ai}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_CHARSET: ${DB_CHARSET:-utf8mb4}
      FLASK_DEBUG: ${FLASK_DEBUG:-1}
      HERMES_API_KEY: ${HERMES_API_KEY:-change_me_hermes_key}
      TZ: Asia/Taipei
      PYTHONPATH: /workspace/python
      UV_PROJECT_ENVIRONMENT: /opt/venv
    ports:
      - "127.0.0.1:${FLASK_PORT:-5001}:5000"
    volumes:
      - ./:/workspace
    working_dir: /workspace/python
    command: ["uv", "run", "flask", "--app", "app.api:app", "run", "--host=0.0.0.0", "--port=5000", "--reload"]
    networks:
      - recipe-net

networks:
  recipe-net:
    name: recipe-net
