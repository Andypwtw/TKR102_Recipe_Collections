services:
  init-permissions:
    image: alpine:latest
    container_name: recipe-init-permissions
    user: root
    command: >
      sh -c "
        mkdir -p /mnt/mysql /mnt/mongodb /mnt/kafka /mnt/postgres /mnt/airflow-logs /mnt/airflow-dags /mnt/airflow-plugins &&
        chown -R 999:999 /mnt/mysql &&
        chown -R 999:999 /mnt/mongodb &&
        chown -R 1000:1000 /mnt/kafka &&
        chown -R 70:70 /mnt/postgres &&
        chown -R 50000:0 /mnt/airflow-logs /mnt/airflow-dags /mnt/airflow-plugins &&
        chmod -R 775 /mnt/airflow-logs /mnt/airflow-dags /mnt/airflow-plugins
      "
    volumes:
      - ./mysql/data:/mnt/mysql
      - ./mongodb/data:/mnt/mongodb
      - ./kafka/data:/mnt/kafka
      - ./postgres/data:/mnt/postgres
      - ./airflow/logs:/mnt/airflow-logs
      - ./airflow/dags:/mnt/airflow-dags
      - ./airflow/plugins:/mnt/airflow-plugins

  mysql:
    image: mysql:8.4
    container_name: recipe-mysql
    restart: unless-stopped
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-recipe_ai}
      TZ: Asia/Taipei
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [recipe-net]

  mongodb:
    build:
      context: ./mongodb
      dockerfile: Dockerfile
    container_name: recipe-mongodb
    restart: unless-stopped
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-rootpassword}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-recipe_ai}
      TZ: Asia/Taipei
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - ./mongodb/data:/data/db
      - ./mongodb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [recipe-net]

  kafka:
    build:
      context: ./kafka
      dockerfile: Dockerfile
    container_name: recipe-kafka
    restart: unless-stopped
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:29093,PLAINTEXT_HOST://:9094"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9094}"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      KAFKA_CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      TZ: Asia/Taipei
    ports:
      - "${KAFKA_PORT:-9094}:9094"
    volumes:
      - ./kafka/data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks: [recipe-net]

  postgres:
    image: postgres:16-alpine
    container_name: recipe-postgres
    restart: unless-stopped
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
      TZ: Asia/Taipei
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [recipe-net]

  airflow-init:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: recipe-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
      init-permissions:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres/${POSTGRES_DB:-airflow}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-ytower-recipes}
      PYTHONPATH: /opt/airflow/project
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./crawler:/opt/airflow/project/crawler:ro
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create           --username "$${AIRFLOW_ADMIN_USER}"           --firstname Admin           --lastname User           --role Admin           --email admin@example.com           --password "$${AIRFLOW_ADMIN_PASSWORD}" || true
    networks: [recipe-net]

  airflow:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: recipe-airflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres/${POSTGRES_DB:-airflow}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__BASE_URL: http://localhost:${AIRFLOW_PORT:-8080}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-ytower-recipes}
      PYTHONPATH: /opt/airflow/project
      TZ: Asia/Taipei
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./crawler:/opt/airflow/project/crawler:ro
    command: standalone
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks: [recipe-net]

  python:
    build:
      context: ./python
      dockerfile: Dockerfile
    container_name: recipe-python
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-recipe_ai}
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD:-rootpassword}@mongodb:27017/${MONGO_DATABASE:-recipe_ai}?authSource=admin
      MONGO_DATABASE: ${MONGO_DATABASE:-recipe_ai}
      MONGO_COLLECTION: ${MONGO_COLLECTION:-raw_recipes}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-ytower-recipes}
      PYTHONPATH: /workspace/python
      UV_PROJECT_ENVIRONMENT: /opt/venv
    ports:
      - "${FLASK_PORT:-5001}:5000"
    volumes:
      - ./:/workspace
    working_dir: /workspace/python
    command: uv run flask --app app.api:app run --host=0.0.0.0 --port=5000
    networks: [recipe-net]

  kafka-to-mongodb:
    build:
      context: ./python
      dockerfile: Dockerfile
    container_name: recipe-kafka-to-mongodb
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-ytower-recipes}
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD:-rootpassword}@mongodb:27017/${MONGO_DATABASE:-recipe_ai}?authSource=admin
      MONGO_DATABASE: ${MONGO_DATABASE:-recipe_ai}
      MONGO_COLLECTION: ${MONGO_COLLECTION:-raw_recipes}
      PYTHONPATH: /workspace/python
      UV_PROJECT_ENVIRONMENT: /opt/venv
    volumes:
      - ./:/workspace
    working_dir: /workspace/python
    command: uv run python services/kafka_to_mongodb.py
    networks: [recipe-net]

networks:
  recipe-net:
    driver: bridge
