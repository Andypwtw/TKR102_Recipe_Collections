services:
  # --- 自動修正檔案權限與建立資料夾 ---
  init-permissions:
    image: alpine:latest
    container_name: recipe-init-permissions
    user: root
    command: >
      sh -c "
        mkdir -p /mnt/mysql /mnt/mongodb /mnt/kafka /mnt/postgres /mnt/airflow-logs /mnt/airflow-dags /mnt/airflow-plugins &&
        chown -R 999:999 /mnt/mysql &&
        chown -R 999:999 /mnt/mongodb &&
        chown -R 1000:1000 /mnt/kafka &&
        chown -R 70:70 /mnt/postgres &&
        chown -R 50000:0 /mnt/airflow-logs /mnt/airflow-dags /mnt/airflow-plugins &&
        chmod -R 775 /mnt/airflow-logs /mnt/airflow-dags /mnt/airflow-plugins
      "
    volumes:
      - ./mysql/data:/mnt/mysql
      - ./mongodb/data:/mnt/mongodb
      - ./kafka/data:/mnt/kafka
      - ./postgres/data:/mnt/postgres
      - ./airflow/logs:/mnt/airflow-logs
      - ./airflow/dags:/mnt/airflow-dags
      - ./airflow/plugins:/mnt/airflow-plugins

  # --- Existing MySQL Service ---
  mysql:
    image: mysql:8.4
    container_name: recipe-mysql
    restart: unless-stopped
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-recipe_ai}
      TZ: Asia/Taipei
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - recipe-net

  # --- MongoDB ---
  mongodb:
    build:
      context: ./mongodb
      dockerfile: Dockerfile
    container_name: recipe-mongodb
    restart: unless-stopped
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-rootpassword}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-recipe_ai}
      TZ: Asia/Taipei
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - ./mongodb/data:/data/db
      - ./mongodb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - recipe-net

  # --- Kafka (KRaft Mode) ---
  kafka:
    build:
      context: ./kafka
      dockerfile: Dockerfile
    container_name: recipe-kafka
    restart: unless-stopped
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9094}'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:29093,PLAINTEXT_HOST://:9094'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      TZ: Asia/Taipei
    ports:
      - "${KAFKA_PORT:-9094}:9094"
    volumes:
      - ./kafka/data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - recipe-net

  # --- Airflow Postgres (Airflow Metadata DB) ---
  postgres:
    image: postgres:16-alpine
    container_name: recipe-postgres
    restart: unless-stopped
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
      TZ: Asia/Taipei
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - recipe-net

  # --- Airflow Init ---
  airflow-init:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: recipe-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
      init-permissions:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres/${POSTGRES_DB:-airflow}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      # 一開始即自動載入 mysql_default 連線
      AIRFLOW_CONN_MYSQL_DEFAULT: 'mysql://root:${MYSQL_ROOT_PASSWORD:-rootpassword}@mysql:3306/${MYSQL_DATABASE:-recipe_ai}'
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate && \
        airflow users create \
          --username $${AIRFLOW_ADMIN_USER} \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password $${AIRFLOW_ADMIN_PASSWORD} || true
    networks:
      - recipe-net

  # --- Airflow Standalone ---
  airflow:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: recipe-airflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres/${POSTGRES_DB:-airflow}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      TZ: Asia/Taipei
      AIRFLOW__WEBSERVER__BASE_URL: http://localhost:${AIRFLOW_PORT:-8080}
      AIRFLOW__LOGGING__WORKER_LOG_SERVER_PORT: 8793
      # 一開始即自動載入 mysql_default 連線
      AIRFLOW_CONN_MYSQL_DEFAULT: 'mysql://root:${MYSQL_ROOT_PASSWORD:-rootpassword}@mysql:3306/${MYSQL_DATABASE:-recipe_ai}'
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    command: standalone
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - recipe-net

networks:
  recipe-net:
    driver: bridge