[project]
name = "recipe-collections"
version = "0.2.0"
description = "YTower recipe ETL, MySQL normalization, nutrition matching and Flask API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "curl-cffi>=0.15.0",
    "cryptography>=46.0.0",
    "flask>=3.1.3",
    "kaggle>=1.8.3",
    "matplotlib>=3.10.8",
    "numpy!=2.4.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pymongo>=4.16.0",
    "pymysql>=1.2.0",
    "python-dateutil>=2.9.0.post0",
    "requests>=2.32.5",
    "seaborn>=0.13.2",
    "selenium>=4.39.0",
    "webdriver-manager>=4.0.2",
    "yfinance>=1.0",
]

[tool.uv]
package = false
